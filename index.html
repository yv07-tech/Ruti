<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#58cc02" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Ruti · Inglés Profesional y Comunicativo</title>
  <link rel="manifest" id="pwa-manifest" />
  <style>
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --surface-alt: #f0f2f5;
      --text: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --border-bottom: #d1d5db;
      --primary: #58cc02;
      --primary-dark: #46a302;
      --secondary: #1cb0f6;
      --secondary-dark: #148bc4;
      --danger: #ff4b4b;
      --danger-dark: #d93838;
      --warning: #ffc800;
      --warning-dark: #d9a800;
      --purple: #ce82ff;
      --purple-dark: #a55eea;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
      --radius: 16px;
    }

    [data-theme="dark"] {
      --bg: #131f24;
      --surface: #1b2a32;
      --surface-alt: #243741;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2e4450;
      --border-bottom: #10191e;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.25s, color 0.25s;
    }

    /* Header */
    header {
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--primary);
      display: grid;
      place-items: center;
      box-shadow: 0 3px 0 var(--primary-dark);
      overflow: hidden;
      flex-shrink: 0;
    }

    .brand-logo svg {
      width: 34px;
      height: 34px;
      display: block;
    }

    .brand-title {
      font-weight: 800;
      font-size: 16px;
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: var(--surface-alt);
      border: 2px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 7px 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: transform 0.1s;
    }

    .icon-btn:active {
      transform: translateY(2px);
    }

    /* Container */
    main {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 18px 16px 40px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Cards & Buttons */
    .card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-bottom-width: 4px;
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(28, 176, 246, 0.15);
      color: var(--secondary);
      margin-bottom: 8px;
    }

    .badge.green {
      background: rgba(88, 204, 2, 0.15);
      color: var(--primary);
    }

    .badge.purple {
      background: rgba(206, 130, 255, 0.18);
      color: var(--purple);
    }

    h1, h2, h3 {
      margin: 0 0 8px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 18px 0 10px;
    }

    /* Subject Selector */
    .subject-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 600px) {
      .subject-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .subject-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-bottom-width: 4px;
      border-radius: var(--radius);
      padding: 14px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
    }

    .subject-card.active {
      border-color: var(--secondary);
      background: rgba(28, 176, 246, 0.08);
    }

    .subject-card h3 {
      font-size: 15px;
      margin-bottom: 4px;
    }

    .subject-card p {
      margin: 0;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.35;
    }

    /* Modes Grid */
    .modes-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (min-width: 600px) {
      .modes-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .mode-btn {
      background: var(--surface);
      border: 2px solid var(--border);
      border-bottom-width: 4px;
      border-radius: 14px;
      padding: 14px 12px;
      cursor: pointer;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: var(--text);
      transition: transform 0.1s, border-color 0.15s;
    }

    .mode-btn:hover {
      border-color: var(--primary);
    }

    .mode-btn:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .mode-icon {
      font-size: 24px;
    }

    .mode-name {
      font-weight: 800;
      font-size: 14px;
    }

    .mode-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .mode-btn.featured {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, rgba(88, 204, 2, 0.12), rgba(28, 176, 246, 0.12));
      border-color: var(--primary);
      flex-direction: row;
      align-items: center;
      gap: 14px;
    }

    /* Stats bar */
    .stats-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat-pill {
      flex: 1;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 800;
      font-size: 13px;
    }

    /* Lesson Screen */
    .lesson-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 24px;
      font-weight: 800;
      cursor: pointer;
      padding: 4px;
    }

    .progress-track {
      flex: 1;
      height: 14px;
      background: var(--surface-alt);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 999px;
    }

    .hearts {
      font-weight: 800;
      color: var(--danger);
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .question-meta {
      font-size: 12px;
      font-weight: 800;
      color
